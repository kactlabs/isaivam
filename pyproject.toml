[project]
name = "isaivam"
version = "0.1.0"
description = "Evaluation framework for RAG and LLM applications (isaivam)"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    # Core dependencies
    "numpy>=1.21.0,<3.0.0",
    "datasets>=4.0.0",
    "tiktoken",
    "pydantic>=2.0.0",
    "nest-asyncio",
    "appdirs",
    "diskcache>=5.6.3",
    "typer",
    "rich",
    "openai>=1.0.0",
    "tqdm",
    "instructor",
    "pillow>=10.4.0",
    "networkx",
    "scikit-network",
    "requests",

    # LangChain ecosystem
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain_openai",
]
dynamic = ["readme"]

[project.optional-dependencies]
# Core optional features
all = [
    "sentence-transformers",
    "transformers",
    "nltk",
    "rouge_score",
    "rapidfuzz",
    "pandas",
    "datacompy",
    "sacrebleu",
    "llama_index",
    "r2r",
    "GitPython"
]

# Specific integrations
git = ["GitPython"]
tracing = ["langfuse>=3.2.4", "mlflow>=3.1.4"]
gdrive = [
    "google-api-python-client>=2.178.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2"
]
ai-frameworks = ["haystack-ai"]
oci = ["oci>=2.160.1"]
ag-ui = ["ag-ui-protocol>=0.1.9", "httpx>=0.27.0"]
dspy = ["dspy-ai>=2.4.0"]

[project.urls]
Homepage = "https://github.com/kactlabs/isaivam"
Code = "https://github.com/kactlabs/isaivam"

[project.entry-points."isaivam.backends"]
"local/csv" = "isaivam.backends.local_csv:LocalCSVBackend"
"local/jsonl" = "isaivam.backends.local_jsonl:LocalJSONLBackend"
"inmemory" = "isaivam.backends.inmemory:InMemoryBackend"
"gdrive" = "isaivam.backends.gdrive_backend:GDriveBackend"

[project.scripts]
isaivam = "isaivam.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["*.ipynb", "*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["isaivam"]
force-single-line = false
combine-as-imports = true

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
